name: Publish to OrcaCloud

# Publishes every GitHub release to the Filament Saver plugin on Orca Cloud: the tag (vX.Y.Z) is
# the version and the release notes are the changelog. Based on the workflow in the Orca Cloud
# guide (https://cloud.orcaslicer.com/wiki/). Authenticates with GitHub's OIDC token: no secrets.

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  # Orca Cloud needs the target OS in the file name; "any" because the plugin is pure Python.
  PLUGIN_FILES: "dist/filament_saver_any.py"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the plugin version matches the tag
        run: |
          set -euo pipefail
          header="$(sed -n 's/^# version = "\(.*\)"$/\1/p' plugin/filament_saver/filament_saver.py)"
          constant="$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' plugin/filament_saver/filament_saver.py)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$header" != "$tag" ] || [ "$constant" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the plugin version (header $header, VERSION $constant)" >&2
            exit 1
          fi

      - name: Run the tests
        run: python3 -m unittest discover -s tests

      - name: Build the upload file
        run: |
          mkdir -p dist
          cp plugin/filament_saver/filament_saver.py dist/filament_saver_any.py

      - name: Publish release to OrcaCloud
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          version="${GITHUB_REF_NAME#v}"
          changelog="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" | head -c 4000)"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          args=(-F "metadata=$metadata")
          shopt -s nullglob
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          if [ "${#args[@]}" -eq 1 ]; then
            echo "No plugin files matched: $PLUGIN_FILES" >&2
            exit 1
          fi
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          [ "$status" = "201" ]
